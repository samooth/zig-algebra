name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig fmt --check .

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Run all tests
        run: zig build test --summary all

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseFast

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      # Informational only: shared runners are noisy; no regression thresholds.
      - name: Run benchmarks
        run: zig build bench -Doptimize=ReleaseFast | tee benchmark-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  stark-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Run STARK prover demo (Fibonacci over M31 via FRI)
        run: zig build stark

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Build wasm32-freestanding modules (zig build wasm + wasm-pairing)
        run: |
          zig build wasm
          zig build wasm-pairing
      - name: Verify field exports and value tests from Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/wasm_field_smoke.js
      - name: Pairing WASM smoke (validations + in-module bilinearity)
        run: node scripts/wasm_pairing_smoke.js
