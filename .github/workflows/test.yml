name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - run: zig fmt --check .

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Run all tests
        run: zig build test --summary all

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseFast

  stark-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Run STARK prover demo (Fibonacci over M31 via FRI)
        run: zig build stark

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Build wasm32-freestanding module (zig build wasm)
        run: zig build wasm
      - name: Verify exports and call fp_mul from Node
        run: |
          node -e '
          const fs = require("fs");
          (async () => {
            const { instance } = await WebAssembly.instantiate(
              fs.readFileSync("zig-out/bin/zig_algebra_fp.wasm"), {});
            const e = instance.exports;
            for (const name of ["fp_add", "fp_mul", "fp_inv"]) {
              if (typeof e[name] !== "function") throw new Error("missing export: " + name);
            }
            if (e.fp_mul(5n, 0n, 7n, 0n) !== 35n) throw new Error("fp_mul(5,7) != 35");
            console.log("wasm exports OK:", Object.keys(e).join(", "));
          })().catch((err) => { console.error(err); process.exit(1); });
          '
