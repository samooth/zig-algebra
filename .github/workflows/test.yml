name: test

on:
  push:
    branches: [main]
    # A release tag is a release gate. Without this, pushing v* ran zero jobs
    # and a tag could be published on a commit whose `zig build bench` did not
    # compile -- which is exactly what happened with v0.5.0 (c47b4b0). This
    # trigger is detection, not prevention: the human rule in AGENTS.md (do not
    # push the tag until CI is green on that commit) is what prevents it. The
    # two are complementary and both are needed.
    tags: ['v*']
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig libs examples bench scripts

  assert-ledger:
    # The gate from docs/assert-ledger.md: fails on a std.debug.assert the
    # committed ledger does not account for, and specifically on a new one in a
    # pub entry point. Part of the release gate, so a new precondition cannot
    # reach a tag unreviewed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig build assert-check

  ct-ledger:
    # The gate for the constant-time judgements. Every docstring in this workspace
    # that says "branchless" is a judgement about a secret, and a judgement is not
    # auditable. What is auditable is the count behind it, where the count came
    # from, and whether the function was even reachable in an emission -- so this
    # job fails when any of those five is missing or blank. It does not classify
    # jumps; four attempts at that from the instruction text alone were each wrong
    # in a direction the previous one was not, and 'test r8, 8' is the case that
    # settles it. Row 13 of AUDIT.md, which is why the ledger covers one function
    # and not the forty-seven claims it would take to close that row.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig build ct-check

  audit-ledger:
    # The gate for AUDIT.md. A register of open items fails silently, so this
    # one requires a closing criterion on every row, an owner on every decision
    # row, declared counts that match the rows, and every `git show` in the
    # document to resolve. Row 11 sat open for a week with nothing failing; this
    # is the job that would have made it visible on the day it was added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Not needed for the checksum rule, which reads a file that is in the
          # tree. Kept so that a `git show` added to AUDIT.md later resolves
          # against a published ref instead of failing on a shallow clone.
          fetch-depth: 0
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig build audit-check

  changelog-ledger:
    # CHANGELOG.md is read before a consumer bumps, so its release headers are
    # checked: unique versions, descending order, non-empty bodies. Row 14 of
    # AUDIT.md until 2026-09-30, and the day it was written it found v0.5.1
    # filed 104 lines below v0.5.0 in a published changelog.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig build changelog-check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Run all tests
        run: zig build test --summary all

  counts-ledger:
    # Every test count written in prose, against docs/test_counts.json AND
    # against the number the suite actually reports. This runs the suite itself
    # rather than borrowing the matrix job's, for two reasons that cost three red
    # runs to learn: the build's summary line goes to stderr, so a stdout-only
    # pipe captures nothing; Actions runs the default shell with no pipefail, so a
    # failing suite pipes to tee and returns 0; and on windows-latest the default
    # shell is PowerShell, which does not accept `set -o pipefail` at all. Keeping
    # this in one ubuntu job with one shell removes all three.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      # pipefail is load-bearing: without it a failing suite leaves this job green
      # and the gate below reports everything in order over a red suite. Measured
      # with a stub exiting 1: rc=0 without pipefail, rc=1 with it.
      - name: Run the suite and keep its own summary
        run: |
          set -o pipefail
          zig build test --summary all 2>&1 | tee suite-summary.txt
      - name: Check every documented test count against what the suite reported
        run: zig build counts-check -- --summary-file suite-summary.txt

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseFast

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      # A red job here BLOCKS the tag. Only the numbers are informational:
      # shared runners are noisy, so there are no regression thresholds and
      # nobody should read a slow number as a regression. A compile failure is
      # not informational, and the comment used to read as if it were, which is
      # how a broken `zig build bench` sat on a signed tag unnoticed.
      - name: Build and run benchmarks
        run: zig build bench -Doptimize=ReleaseFast | tee benchmark-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  cross-check:
    # Compile every library's test binary for Windows and macOS without running
    # it. This exists because `zig build test` on Linux could not see the
    # Windows compile error in `libs/rng/src/csprng.zig` -- `BCryptGenRandom`
    # takes a `windows.HANDLE` (`*anyopaque`) and a bare `null` does not coerce
    # to it in Zig 0.16. Every Linux run was green; only the `windows-latest`
    # job could see it, and it did, in 2m35s of CI. Locally the same check is
    # `zig build cross-check`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      # `--summary all` so the log names the 34 binaries it compiled (17
      # libraries x 2 targets). Without it the step is silent on success: it
      # takes about a minute of real work and the log shows only the command,
      # so a reader cannot tell a working gate from one that did nothing. That
      # is the same failure mode as a check that produces no output, applied to
      # a check that *did* pass -- the job was green, and still said nothing
      # about what it had verified.
      - run: zig build cross-check --summary all

  fuzz:
    # `zig build fuzz` was never in CI, so the randomized property runner was
    # only ever exercised by whoever happened to run it locally. It is ~40s in
    # ReleaseFast, which is cheap enough to gate on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - run: zig build fuzz -Doptimize=ReleaseFast

  stark-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Run STARK prover demo (Fibonacci over Goldilocks via FRI)
        run: zig build stark

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0
      - name: Build wasm32-freestanding modules (zig build wasm + wasm-pairing)
        run: |
          zig build wasm
          zig build wasm-pairing
      - name: Verify field exports and value tests from Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/wasm_field_smoke.js
      - name: Pairing WASM smoke (validations + in-module bilinearity)
        run: node scripts/wasm_pairing_smoke.js
